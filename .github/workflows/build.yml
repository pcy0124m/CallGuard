name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 手动编译用的 Manifest 带 package 属性，AGP 8 要求去掉（namespace 在 gradle 里）
      - name: Prepare manifest for AGP 8
        run: sed -i 's/ package="com.kuku.callguard"//' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
